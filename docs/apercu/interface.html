<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Berger</title>
<style>
/* Interface web de Berger — tableau de bord d'exploitation (retour du propriétaire, 14/10) : neutre et net. Gris froid,
   UN accent bleu, couleurs d'état franches (contraste AA), bordures fines, coins de 4 à 6 px, chiffres tabulaires, tableaux
   compacts à en-tête collant. Barre latérale sur grand écran, barre du bas sur téléphone ; mode sombre propre (pas inversé). */
:root {
  --fond: #f6f7f9; --surface: #ffffff; --surface-2: #f1f3f5; --bord: #dfe3e8; --bord-fort: #c9cfd6;
  --texte: #111827; --texte-2: #4b5563; --texte-3: #6b7280;
  --accent: #1d5fd1; --accent-fond: #e8f0fd;
  --vert: #157347; --vert-fond: #e6f4ec; --jaune: #8a5a00; --jaune-fond: #fdf3d8; --rouge: #b42318; --rouge-fond: #fdecea;
  --bleu: #1d5fd1; --bleu-fond: #e8f0fd; --gris: #6b7280; --gris-fond: #eef0f3;
  --rayon: 6px; --laterale: 232px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="clair"]) {
  --fond: #0e1116; --surface: #151a21; --surface-2: #1b212a; --bord: #29313c; --bord-fort: #36404d;
  --texte: #e6e9ee; --texte-2: #b3bac5; --texte-3: #8b94a1;
  --accent: #5b9bff; --accent-fond: #182a45;
  --vert: #4cc38a; --vert-fond: #12301f; --jaune: #e5b453; --jaune-fond: #352a12; --rouge: #ff7b72; --rouge-fond: #3a1a18;
  --bleu: #5b9bff; --bleu-fond: #182a45; --gris: #8b94a1; --gris-fond: #212831; } }
:root[data-theme="sombre"] {
  --fond: #0e1116; --surface: #151a21; --surface-2: #1b212a; --bord: #29313c; --bord-fort: #36404d;
  --texte: #e6e9ee; --texte-2: #b3bac5; --texte-3: #8b94a1;
  --accent: #5b9bff; --accent-fond: #182a45;
  --vert: #4cc38a; --vert-fond: #12301f; --jaune: #e5b453; --jaune-fond: #352a12; --rouge: #ff7b72; --rouge-fond: #3a1a18;
  --bleu: #5b9bff; --bleu-fond: #182a45; --gris: #8b94a1; --gris-fond: #212831; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: var(--fond); color: var(--texte);
       font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
.app { display: grid; grid-template-columns: var(--laterale) minmax(0, 1fr); min-height: 100vh; }

/* barre latérale */
.laterale { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--surface); border-right: 1px solid var(--bord);
            padding: .75rem .5rem; display: flex; flex-direction: column; gap: .15rem; }
.marque { font-weight: 700; font-size: 15px; letter-spacing: -.01em; padding: .35rem .6rem .85rem; }
.rubrique { font-size: 12px; font-weight: 600; color: var(--texte-3); padding: .9rem .6rem .3rem; }
.laterale nav { display: flex; flex-direction: column; gap: 1px; }
.entree { display: flex; align-items: center; gap: .6rem; width: 100%; padding: .45rem .6rem; border: 0; border-radius: var(--rayon);
          background: transparent; color: var(--texte-2); font: inherit; text-align: left; cursor: pointer; min-height: 34px; }
.entree:hover { background: var(--surface-2); color: var(--texte); }
.entree[aria-current="page"] { background: var(--accent-fond); color: var(--accent); font-weight: 600; }
.entree-libelle { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icone { width: 18px; height: 18px; flex: 0 0 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.compteur { min-width: 20px; padding: 0 6px; border-radius: 10px; background: var(--rouge); color: #fff; font-size: 11px; font-weight: 600; line-height: 20px; text-align: center; }
.seulement-mobile { display: none !important; }

/* en-tête */
.principal { min-width: 0; display: flex; flex-direction: column; }
.entete { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; padding: .6rem 1.5rem;
          background: var(--surface); border-bottom: 1px solid var(--bord); min-height: 52px; }
.entete h1 { font-size: 16px; font-weight: 600; margin: 0; }
.global { display: flex; gap: .9rem; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--texte-2); }
#etat { margin-left: auto; font-size: 12px; }
.sous-onglets { display: flex; gap: .25rem; padding: .5rem 1.5rem; border-bottom: 1px solid var(--bord); background: var(--surface); overflow-x: auto; }
.sous-onglets button, .choix-agent button { font: inherit; font-size: 13px; padding: .3rem .7rem; border: 1px solid var(--bord); border-radius: var(--rayon);
                       background: var(--surface); color: var(--texte-2); cursor: pointer; white-space: nowrap; min-height: 32px; }
.sous-onglets button[aria-pressed="true"], .choix-agent button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-fond); font-weight: 600; }
main.perime { opacity: .55; }
main { padding: 1.25rem 1.5rem 2.5rem; max-width: 1400px; width: 100%; }

/* blocs, tuiles */
.page { display: grid; gap: 1rem; }
.deux { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
.bloc { background: var(--surface); border: 1px solid var(--bord); border-radius: var(--rayon); min-width: 0; }
.bloc > header { display: flex; align-items: center; gap: .5rem; padding: .6rem .9rem; border-bottom: 1px solid var(--bord); }
.bloc h2 { font-size: 13px; font-weight: 600; margin: 0; }
.nombre { font-size: 12px; color: var(--texte-3); background: var(--surface-2); border: 1px solid var(--bord); border-radius: 4px; padding: 0 6px; }
.bloc > .corps { padding: .4rem .9rem .7rem; }
.tuiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; }
.tuile { background: var(--surface); border: 1px solid var(--bord); border-radius: var(--rayon); padding: .7rem .9rem; border-top: 3px solid var(--bord-fort); }
.tuile .valeur { font-size: 24px; font-weight: 600; line-height: 1.2; }
.tuile .libelle { font-size: 12px; color: var(--texte-3); }
.u-jaune { border-top-color: var(--jaune); } .u-jaune .valeur { color: var(--jaune); }
.u-rouge { border-top-color: var(--rouge); } .u-rouge .valeur { color: var(--rouge); }

/* listes de lignes */
.liste-lignes { display: flex; flex-direction: column; }
.ligne-liste { padding: .55rem 0; border-bottom: 1px solid var(--bord); min-width: 0; overflow-wrap: anywhere; }
.ligne-liste:last-child { border-bottom: 0; }
.l1 { display: flex; align-items: baseline; gap: .45rem; flex-wrap: wrap; }
.heure, .chiffre { color: var(--texte-3); font-size: 12px; font-variant-numeric: tabular-nums; }
.heure { margin-left: auto; }
.sous-titre { font-size: 12px; font-weight: 600; color: var(--texte-3); padding: .6rem 0 .1rem; }
.alerte { padding-left: .6rem; border-left: 3px solid var(--bord-fort); }
.a-rouge { border-left-color: var(--rouge); } .a-jaune { border-left-color: var(--jaune); }
.doc { display: flex; align-items: center; gap: .6rem; }
.doc-texte { flex: 1; min-width: 0; } .doc.lu .doc-titre { color: var(--texte-2); }
.vide { color: var(--texte-3); margin: .5rem 0; }
.pale { color: var(--texte-3); } .petit { font-size: 12px; }
code { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 12px; background: var(--surface-2); border: 1px solid var(--bord);
       border-radius: 4px; padding: 0 .35rem; }

/* états */
.etat { display: inline-flex; align-items: center; gap: .4rem; white-space: nowrap; margin-right: .7rem; }
.statuts { display: inline-flex; flex-wrap: wrap; }
.point { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; display: inline-block; }
.p-bleu { background: var(--bleu); } .p-vert { background: var(--vert); } .p-rouge { background: var(--rouge); } .p-jaune { background: var(--jaune); }
.p-gris, .p-pale { background: var(--gris); } .p-cyan { background: var(--bleu); } .p-vide { background: transparent; border: 1.5px solid var(--gris); }
.etiquette { display: inline-block; font-size: 11px; font-weight: 600; line-height: 18px; padding: 0 6px; border-radius: 4px; white-space: nowrap; }
.e-rouge { background: var(--rouge-fond); color: var(--rouge); } .e-jaune { background: var(--jaune-fond); color: var(--jaune); }
.e-vert { background: var(--vert-fond); color: var(--vert); } .e-bleu, .e-cyan { background: var(--bleu-fond); color: var(--bleu); }
.e-gris, .e-pale { background: var(--gris-fond); color: var(--texte-2); }
.t-rouge { color: var(--rouge); } .t-jaune { color: var(--jaune); } .t-vert { color: var(--vert); } .t-bleu, .t-cyan { color: var(--bleu); } .t-pale { color: var(--texte-3); }
.travail { display: grid; gap: .25rem; min-width: 12rem; }
.progression { display: flex; align-items: center; gap: .5rem; }
.barre { width: 120px; max-width: 60%; height: 6px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--bord); overflow: hidden; }
.barre > span { display: block; height: 100%; background: var(--accent); }

/* tableaux compacts */
.table { overflow-x: auto; margin: 0 -.9rem; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { position: sticky; top: 0; background: var(--surface); text-align: left; font-weight: 600; font-size: 12px; color: var(--texte-3);
     padding: .45rem .9rem; border-bottom: 1px solid var(--bord); white-space: nowrap; }
td { padding: .5rem .9rem; border-bottom: 1px solid var(--bord); vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--surface-2); }
.texte-long { max-width: 60ch; }

/* kanban (Tableau) */
.kanban { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 1rem; align-items: start; }
.colonne { background: var(--surface-2); border: 1px solid var(--bord); border-radius: var(--rayon); padding: .5rem; display: grid; gap: .5rem; }
.colonne > header { display: flex; align-items: center; gap: .45rem; padding: .2rem .3rem; }
.colonne h2 { font-size: 13px; font-weight: 600; margin: 0; flex: 1; }
.carte-kanban { background: var(--surface); border: 1px solid var(--bord); border-radius: var(--rayon); padding: .5rem .6rem; }
.carte-kanban.vif { border-color: var(--accent); }
.lignes > div { font-size: 13px; }

/* propriétés (gabarit générique) */
dl.proprietes { display: grid; grid-template-columns: minmax(9rem, max-content) minmax(0, 1fr); gap: .35rem 1.2rem; margin: .4rem 0; }
dl.proprietes dt { color: var(--texte-3); }
dl.proprietes dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

/* boutons */
button.lien, button.retour { font: inherit; font-size: 13px; color: var(--accent); background: var(--surface); border: 1px solid var(--bord);
                             border-radius: var(--rayon); padding: .25rem .7rem; cursor: pointer; white-space: nowrap; min-height: 30px; }
button.lien:hover, button.retour:hover { border-color: var(--accent); }
button.retour { margin-bottom: 1rem; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.markdown h3, .markdown h4, .markdown h5 { margin: 1rem 0 .4rem; font-size: 14px; }
.markdown p { margin: .35rem 0; } .markdown p.puce { margin-left: .8rem; }
.cadre-livrable { display: block; width: 100%; height: 75vh; margin: .6rem 0; border: 1px solid var(--bord); border-radius: var(--rayon); background: #fff; }
.markdown pre { background: var(--surface-2); border: 1px solid var(--bord); border-radius: var(--rayon); padding: .6rem; overflow-x: auto; }

/* téléphone : barre du bas, une colonne, tableaux en listes empilées, cibles de 44 px, rien de coupé à 360 px */
@media (max-width: 820px) {
  body { font-size: 15px; }
  .app { grid-template-columns: minmax(0, 1fr); }
  .laterale { position: fixed; bottom: 0; left: 0; right: 0; top: auto; height: auto; z-index: 5; padding: 0 0 env(safe-area-inset-bottom);
              border-right: 0; border-top: 1px solid var(--bord); flex-direction: row; overflow-x: auto; }
  .marque, .rubrique, #liste-agents { display: none !important; }
  .laterale nav { flex-direction: row; gap: 0; }
  .entree { flex-direction: column; gap: 2px; width: auto; min-width: 72px; min-height: 56px; padding: .35rem .5rem; border-radius: 0; font-size: 11px; position: relative; justify-content: center; }
  .entree-libelle { max-width: 76px; text-align: center; }
  .entree .compteur { position: absolute; top: 4px; right: 10px; min-width: 16px; line-height: 16px; font-size: 10px; padding: 0 4px; }
  .seulement-mobile { display: flex !important; }
  .choix-agent { gap: .25rem; margin-right: .5rem; }
  .entete { padding: .5rem .9rem; }
  #etat { margin-left: 0; width: 100%; }
  .sous-onglets { padding: .45rem .9rem; }
  .sous-onglets button, .choix-agent button, button.lien, button.retour { min-height: 44px; }
  main { padding: .9rem .9rem 6rem; }
  .deux { grid-template-columns: minmax(0, 1fr); }
  .tuiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .6rem; }
  .table { margin: 0; overflow: visible; }
  table, thead, tbody, tr, td { display: block; width: 100%; }
  thead { display: none; }
  tbody tr { border-bottom: 1px solid var(--bord); padding: .5rem 0; }
  tbody tr:last-child { border-bottom: 0; }
  td { border: 0; padding: .15rem 0; display: grid; grid-template-columns: 7.5rem minmax(0, 1fr); gap: .5rem; }
  td::before { content: attr(data-label); color: var(--texte-3); font-size: 12px; }
  td[data-label=""]::before { content: none; }
  tbody tr:hover td { background: transparent; }
  .travail { min-width: 0; }
  dl.proprietes { grid-template-columns: minmax(0, 1fr); gap: 0; }
  dl.proprietes dd { margin-bottom: .45rem; }
}
</style>

</head>

// Interface web de Berger (spec docs/plans/2026-10-13-interface-spec.md) — lecture seule, sans cadriciel ni étape de

// générique). Les vues principales ont un rendu dédié (bloc DEDIES) ; les icônes de navigation sont dans le bloc ICONES :
// ce sont les SEULS endroits où une vue est nommée. Tout texte venu des données est inséré comme texte (textContent),
// jamais comme HTML. Présentation : tableau de bord d'exploitation, neutre (retour du propriétaire, 14/10).

const RENDUS = {
  texte: (s, v) => texte(v),
  nombre: (s, v) => texte(v === null || v === undefined ? "" : String(v)),

  markdown: (s, v) => markdown(v),
  cache: () => null,
};

// `compteur` = [vue, nombre affiché dans la navigation] ; `global` = ce que la vue donne à l'en-tête (état global) ;
// `fixe` = vue d'objet affichée une fois à l'ouverture, sans relecture automatique. ──
const DEDIES = {

  colonnes: { rendre: d => colonnes(d) },

  alire: { rendre: d => alire(d.documents, "document"), compteur: ["alire", d => d.non_lus] },

  courtier: { global: etatCourtier },
};

    const choix = el("div", { class: "choix-agent seulement-mobile" }, ...AGENTS.map(a => el("button", { type: "button", "data-agent": a.id, "aria-pressed": String(courant.a === a.id) }, a.nom)));
    sous.append(choix, ...VUES.filter(v => v.onglet === "agent").map(v => el("button", { type: "button", "data-vue-agent": v.type, "aria-pressed": String(courant.type === v.type) }, v.titre)));
  }
  const g = document.getElementById("global"); g.replaceChildren();
  for (const x of GLOBAL) g.append(el("span", { class: "etat" }, el("span", { class: "point p-" + x.ton }), x.texte));
  const toi = Object.values(DEDIES).find(x => x.compteur && x.compteur[1] === pourToi);
  const n = toi ? COMPTES[Object.keys(DEDIES).find(k => DEDIES[k] === toi)] : 0;
  if (n) g.append(el("span", { class: "etat" }, etiquette("jaune", String(n)), " t'attend"));
}
async function compter() {
  const globaux = [];
  for (const [type, ded] of Object.entries(DEDIES)) {
    if (!existe(type)) continue;
    try {
      if (ded.compteur) COMPTES[type] = ded.compteur[1](await donnees(ded.compteur[0]));
      if (ded.global) globaux.push(ded.global(await donnees(type)));
    } catch (e) { COMPTES[type] = 0; }
  }
  GLOBAL = globaux; navigation();
}
async function afficher(auto) {
  if (!courant || document.hidden) return;
  if (auto && affiche === courant && (DEDIES[courant.type] || {}).fixe) return;   // vue fixe déjà affichée : on ne la recharge pas
  if (enVol) { encore = true; return; }                                   // une vue à la fois ; un clic pendant ce temps est rejoué ensuite
  enVol = true; encore = false;
  const vise = courant;
  try {
    const ded = vise.mode !== "agent" ? DEDIES[vise.type] : null;
    const d = await donnees(vise.type, vise.a);
    let corps;
    if (ded && ded.rendre) {
      const autres = {};
      for (const t of ded.autres || []) autres[t] = await donnees(t);
      corps = ded.rendre(d, autres);
    } else corps = generique(await schema(vise.type), d);
    if (courant !== vise) return;                                          // la vue a changé pendant la lecture : on n'affiche pas l'ancienne
    const titre = VUES.find(v => v.type === courant.type);
    document.getElementById("titre-vue").textContent = (titre ? titre.titre : courant.type) + (courant.mode === "agent" ? " · " + (AGENTS.find(a => a.id === courant.a) || {}).nom : "");
    document.getElementById("vue").replaceChildren(
      ...(courant.retour ? [el("button", { type: "button", class: "retour", "data-retour": "1" }, "Retour")] : []), corps);
    affiche = courant; dernier = Date.now(); dire("Mis à jour il y a 0 s"); document.getElementById("vue").classList.remove("perime");
  } catch (e) {
    // une erreur se dit, et la dernière vue reçue reste affichée, marquée « données du HH:MM » (jamais une page vide)
    const h = dernier ? new Date(dernier).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }) : null;
    dire((h ? "Données de " + h + " — " : "") + String(e.message || e), true);
    if (dernier && courant === vise) document.getElementById("vue").classList.add("perime");
  } finally { enVol = false; if (encore) afficher(); }
}
function boucle(f, ms) { setTimeout(async () => { try { await f(); } finally { boucle(f, ms); } }, ms); }   // la suivante APRÈS la fin
document.addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  const vueAgent = (VUES.find(v => v.onglet === "agent") || {}).type;
  if (b.dataset.vue) courant = { mode: "berger", type: b.dataset.vue };
  else if (b.dataset.agents) courant = { mode: "agent", type: vueAgent, a: (AGENTS[0] || {}).id };
  else if (b.dataset.agent) courant = { mode: "agent", type: courant && courant.mode === "agent" ? courant.type : vueAgent, a: b.dataset.agent };
  else if (b.dataset.vueAgent) courant = { mode: "agent", type: b.dataset.vueAgent, a: courant.a };
  else if (b.dataset.objet) courant = { mode: "objet", type: b.dataset.objet, a: b.dataset.a, retour: courant.mode === "objet" ? courant.retour : courant };
  else if (b.dataset.retour) courant = courant.retour;
  else return;
  navigation(); afficher(); window.scrollTo(0, 0);
});
document.addEventListener("visibilitychange", () => { if (!document.hidden) afficher(true); });

async function demarrer() {
  try {
    await connexion();
    await schema("communs");
    VUES = (await lire("/api/vues")).vues;
    AGENTS = (await lire("/api/etat")).donnees.agents.map(x => x.agent);
    document.getElementById("rubrique-agents").hidden = !AGENTS.length;
    courant = { mode: "berger", type: VUES.filter(v => v.onglet === "berger")[0].type };
    navigation(); await afficher(); await compter();
    boucle(() => afficher(true), 5000);                                               // la vue visible seulement, 5 s APRÈS la fin de la précédente
    boucle(compter, 30000); setInterval(age, 1000);
  } catch (e) {
    dire(String(e.message || e), true);
  }
}
demarrer();
</script>
