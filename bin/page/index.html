<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Berger</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<div class="app" id="app" data-menu="ouvert">
  <aside class="laterale" aria-label="Menu">
    <div class="marque"><img class="logo" src="/logo.png" alt="" width="32" height="32"><span class="entree-libelle">Berger</span></div>
    <nav id="onglets" aria-label="Vues"></nav>
    <div class="rubrique" id="rubrique-agents" hidden>Agents</div>
    <nav id="liste-agents" aria-label="Agents"></nav>
  </aside>
  <div class="principal">
    <header class="entete">
      <button type="button" class="bouton icone-seule" id="replier" aria-label="Replier ou déplier le menu" title="Replier ou déplier le menu" aria-expanded="true" aria-controls="onglets"><span data-icone="panneau"></span></button>
      <img class="logo logo-entete" src="/logo.png" alt="Berger" width="28" height="28">
      <h1 id="titre-vue">Berger</h1>
      <div id="global" class="global"></div>
      <span id="etat" role="status" aria-live="polite"></span>
      <button type="button" class="puce" id="puce" hidden></button>
      <button type="button" class="bouton icone-seule" id="theme" aria-label="Thème : celui du système" title="Thème : celui du système"><span data-icone="theme"></span></button>
    </header>
    <nav id="agents" class="sous-onglets" aria-label="Vues de l'agent" hidden></nav>
    <main id="vue" tabindex="-1"><p class="chargement" role="status">Chargement…</p></main>
  </div>
</div>
<div class="voile" id="voile" hidden>
  <div class="fenetre" id="fenetre" role="dialog" aria-modal="true" aria-labelledby="f-titre" data-large="0">
    <div class="f-tete"><div class="f-titres"><h2 id="f-titre"></h2><p id="f-sous"></p></div><button type="button" class="bouton icone-seule" id="f-fermer" data-fermer="1" aria-label="Fermer" title="Fermer (Échap)"><span data-icone="fermer"></span></button></div>
    <div class="f-corps" id="f-corps"></div>
    <div class="f-pied" id="f-pied" hidden></div>
  </div>
</div>
<div class="annonce" id="annonce" role="status" aria-live="polite" hidden></div>
</body>
</html>
